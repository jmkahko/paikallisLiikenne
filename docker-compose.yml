# Web-hotelli-simulaatio: Apache 2.4 + PHP 8
#
# Käynnistys:   docker compose up --build
# Sammutus:     docker compose down
# Sovellus:     http://localhost:8080
#
# DIGITRANSIT_API_KEY luetaan .env-tiedostosta ja välitetään containerin
# RUNTIME-ympäristömuuttujaksi. PHP-proxy (api/digitransit.php) lukee sen
# getenv():llä. Avainta ei tarvita build-aikana eikä se päädy imagen
# kerroksiin.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: paikallis-liikenne:local
    container_name: paikallis-liikenne
    ports:
      - "8080:80"
    environment:
      DIGITRANSIT_API_KEY: ${DIGITRANSIT_API_KEY:-}
    restart: unless-stopped
