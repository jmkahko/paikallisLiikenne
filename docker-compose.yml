# Web-hotelli-simulaatio: Apache 2.4 + PHP 8
#
# Käynnistys:   docker compose up --build
# Sammutus:     docker compose down
# Sovellus:     http://localhost:8080
#
# Lukee API-avaimen .env-tiedostosta (sama jota npm run dev käyttää) ja
# välittää sen build-argumenttina, jotta Vite paistaa sen tuotantobundleen.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Compose interpoloi tämän automaattisesti .env-tiedostosta.
        VITE_DIGITRANSIT_API_KEY: ${VITE_DIGITRANSIT_API_KEY:-}
    image: paikallis-liikenne:local
    container_name: paikallis-liikenne
    ports:
      - "8080:80"
    restart: unless-stopped
