# Web-hotelli-simulaatio: Apache 2.4 + PHP 8
#
# Käynnistys:   docker compose up --build
# Sammutus:     docker compose down
# Sovellus:     http://localhost:8080
#
# Ympäristömuuttujat luetaan .env-tiedostosta ja välitetään containerin
# RUNTIME-ympäristömuuttujiksi. PHP-proxy (api/digitransit.php) lukee ne
# getenv():llä. Arvot eivät päädy imagen kerroksiin.
# Täytä .env ennen käynnistystä (ks. .env.example).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: paikallis-liikenne:local
    container_name: paikallis-liikenne
    ports:
      - "8080:80"
    environment:
      DIGITRANSIT_API_KEY: ${DIGITRANSIT_API_KEY:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      DIGITRANSIT_ENDPOINT: ${DIGITRANSIT_ENDPOINT:-}
    restart: unless-stopped
